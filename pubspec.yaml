name: gmail_clone
description: "Project to clone the UI of Gmail app using Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_icons:
  android: true
  adaptive_icon_foreground: "assets/icon/ic_launcher_adaptive_fore.png"
  adaptive_icon_background: "assets/icon/ic_launcher_adaptive_back.png"